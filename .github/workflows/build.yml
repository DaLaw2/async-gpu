name: Build PTX Kernels

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-ptx:
    name: Compile GPU kernels to PTX
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly with nvptx64 target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-08-25
          components: rust-src, llvm-tools, llvm-bitcode-linker
          targets: nvptx64-nvidia-cuda

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/gpu-kernel/target
          key: ptx-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ptx-${{ runner.os }}-

      - name: Build gpu-kernel (PTX)
        working-directory: crates/gpu-kernel
        run: cargo build --release

      - name: Build gpu-protocol (check)
        working-directory: crates/gpu-protocol
        run: cargo check

      - name: Build gpu-atomics (PTX)
        working-directory: crates/gpu-atomics
        run: |
          if [ -f .cargo/config.toml ]; then
            cargo build --release || echo "gpu-atomics build skipped (no standalone config)"
          else
            echo "No .cargo/config.toml, skipping standalone build"
          fi

      - name: Verify PTX output exists
        run: |
          PTX_FILE=$(find crates/gpu-kernel/target/nvptx64-nvidia-cuda/release/deps -name "*.s" | head -1)
          if [ -z "$PTX_FILE" ]; then
            echo "ERROR: No PTX output found"
            exit 1
          fi
          echo "PTX compiled successfully: $PTX_FILE"
          wc -l "$PTX_FILE"

  build-host:
    name: Check host crate compiles
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: host-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            host-${{ runner.os }}-

      - name: Check gpu-host compiles
        run: cargo check --manifest-path crates/gpu-host/Cargo.toml
