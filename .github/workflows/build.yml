name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint (fmt + clippy + docs)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Read nightly version from rust-toolchain.toml
        id: nightly
        run: echo "channel=$(grep '^channel' rust-toolchain.toml | sed 's/.*= *\"\(.*\)\"/\1/')" >> "$GITHUB_OUTPUT"

      - name: Install Rust nightly with nvptx64 target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.nightly.outputs.channel }}
          components: rust-src, llvm-tools, llvm-bitcode-linker
          targets: nvptx64-nvidia-cuda

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lint-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            lint-${{ runner.os }}-

      - name: Run CI lint
        run: bash scripts/ci-lint.sh

  build-host:
    name: Check host crate compiles
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: host-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            host-${{ runner.os }}-

      - name: Create PTX stubs (auto-discovered from include_str! calls)
        run: |
          for f in $(grep -roh 'include_str!("\.\.\/[^"]*\.ptx")' crates/gpu-host/src/ | sed 's/include_str!("\.\.\/\(.*\)")/\1/' | sort -u); do
            echo "// stub for CI" > "crates/gpu-host/$f"
          done

      - name: Check gpu-host compiles
        run: cargo +stable check --manifest-path crates/gpu-host/Cargo.toml
