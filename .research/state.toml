success_criteria = [
    "Vec<T> with transparent host/device residency — no GpuVec, no cudaMemcpy",
    "Pure sequential loops automatically GPU-parallelized with zero annotations",
    "Compiler partitions arbitrary functions between CPU and GPU based on compute intensity",
    "Static async pipelines compile to CUDA Graphs for >= 20% speedup",
]

[[epics]]
