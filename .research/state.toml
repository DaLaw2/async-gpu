    "Data-dependent iteration: kernel autonomously loops (read → process → check convergence → iterate or finalize), pattern not yet demonstrated",
    "Hostcall session persistence: HostcallSession keeps listener + fd table + buffer alive across multiple kernel launches, packet pool reinit between launches",
    "Standard impl Future can be polled warp-cooperatively (lane 0 polls, broadcast result via shfl.sync)",
    "#[warp_async] accepts async fn syntax with .await and ? operator",
    "#[warp_cooperative] async fn compiles via rustc MIR pass and runs correctly on GPU",
]
