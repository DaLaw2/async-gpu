# Autonomous Research Loop State File
# This is exploratory research — the task list evolves dynamically.
# All filenames use sequence counters (seq) to support multiple iterations.

[meta]
created = "2026-03-11"
total_cycles = 0       # Monotonic counter, incremented after each Do/Think/Check phase
completed_tasks = 0
status = "ready"       # ready | running | blocked | completed

# Current cycle position within Think/Do/Check/Adapt
current_mode = "think"     # think | do | check | adapt
current_step = "recovery"  # Micro-step for compression resilience (see research.md)
current_task_id = "1.1"

# Sequence counters for unique file naming across iterations
brainstorm_seq = 0     # Incremented each brainstorm session
review_seq = 0         # Incremented each review session

# Brainstorm trigger control
last_brainstorm_at_completed = 0
brainstorm_interval = 3  # Trigger brainstorm every N completed tasks

# ============================================================
# Research Themes (high-level goals, not a fixed list)
# ============================================================

[themes]
active = [
    "GPU compilation toolchain selection and validation",
    "GPU-Host communication mechanism",
    "Viable path for Rust std on GPU",
    "Async runtime porting to GPU",
]
discovered = []  # New themes found during brainstorm
parked = []      # Themes temporarily shelved

# ============================================================
# File Naming Convention
# ============================================================
# Brainstorm individual:  brainstorm/bs{seq}-{role}.md
# Brainstorm synthesis:   brainstorm/bs{seq}-synthesis.md
# Task findings:          tasks/{task_id}-c{cycle}.md
# Review individual:      reviews/rv{seq}-{task_id}-{role}.md
# Review synthesis:       reviews/rv{seq}-{task_id}-synthesis.md
#
# Examples (multi-iteration scenario):
#   brainstorm/bs1-systems.md      (1st brainstorm, systems agent)
#   brainstorm/bs1-synthesis.md    (1st brainstorm, synthesis)
#   brainstorm/bs2-systems.md      (2nd brainstorm, systems agent)
#   tasks/1.1-c1.md                (task 1.1, done at cycle 1)
#   tasks/1.4-c5.md                (task 1.4, done at cycle 5)
#   tasks/1.4.1-c8.md              (rework of 1.4, done at cycle 8)
#   reviews/rv1-1.4-correctness.md (1st review, task 1.4, correctness)
#   reviews/rv2-1.4.1-correctness.md (2nd review, reworked task)

# ============================================================
# Task Queue (dynamically evolves)
# ============================================================

