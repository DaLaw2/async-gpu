# Autonomous Research Loop State File
# Two-level hierarchy: Theme → Task
# Themes are research directions; Tasks are actionable items within a theme.

[meta]
created = "2026-03-11"
total_cycles = 0       # Monotonic counter, incremented after each completed phase
completed_tasks = 0
status = "ready"       # ready | running | blocked | completed

# Current cycle position within Think/Do/Check/Adapt
current_mode = "think"     # think | do | check | adapt
current_step = "recovery"  # Micro-step for compression resilience
current_task_id = "toolchain.1"

# Sequence counters for unique file naming across iterations
brainstorm_seq = 0
review_seq = 0

# Brainstorm trigger control
last_brainstorm_at_completed = 0
brainstorm_interval = 3

# ============================================================
# File Naming Convention
# ============================================================
# Brainstorm:  brainstorm/bs{seq}-{role}.md, bs{seq}-synthesis.md
# Task:        tasks/{task_id}-c{cycle}.md     (e.g., tasks/toolchain.1-c3.md)
# Review:      reviews/rv{seq}-{task_id}-{role}.md, rv{seq}-{task_id}-synthesis.md
# Rework:      new task ID with .{n} suffix    (e.g., toolchain.4.1)

# ============================================================
# Themes
# ============================================================

[[themes]]
id = "toolchain"
title = "GPU compilation toolchain selection and validation"
status = "active"      # active | parked | completed
spawned_by = "initial" # initial | bs{seq}
goal = "Determine the best Rust-to-GPU compilation path and validate it works"
success_criteria = [
    "Can compile and run a minimal Rust kernel on GPU",
    "Toolchain choice documented with rationale in ADR",
]

[[themes]]
id = "hostcall"
title = "GPU-Host communication mechanism"
status = "active"
spawned_by = "initial"
goal = "Design and implement reliable GPU-to-Host RPC via shared memory"
success_criteria = [
    "GPU kernel can send structured requests to host",
    "Host responds with results",
    "Multiple warps can issue concurrent hostcalls correctly",
]

[[themes]]
id = "gpu-std"
title = "Rust std on GPU via libc shim"
status = "active"
spawned_by = "initial"
goal = "Enable Rust std library on GPU by redirecting libc calls through hostcall"
success_criteria = [
    "println! works from GPU kernel",
    "File I/O works from GPU kernel",
    "Minimal libc facade documented",
]

[[themes]]
id = "async-runtime"
title = "Async executor on GPU"
status = "active"
spawned_by = "initial"
goal = "Port an async executor (Embassy-based) to run on GPU hardware"
success_criteria = [
    "Can poll a Future on GPU",
    "Multiple async tasks run concurrently on GPU",
    "Register pressure and occupancy impact measured",
]

[[themes]]
id = "integration"
title = "End-to-end integration: async + std + hostcall on GPU"
status = "active"
spawned_by = "initial"
goal = "Combine all components into a working async GPU runtime with std support"
success_criteria = [
    "async fn using std APIs runs correctly on GPU",
    "Performance benchmarked against native CUDA",
    "Feature parity comparison with VectorWare demo",
]

