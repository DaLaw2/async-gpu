# ============================================================
# autograd-v1 Epic
# ============================================================

[[epics]]
id = "autograd-v1"
title = "Autograd v1 — tape-based backward pass for linear models + optimizers"
status = "active"
priority = "high"
depends_on = "testing-infra"
success_criteria = [
    "Tape records forward ops and backward() traverses in reverse topological order",
    "Backward kernels for: Linear, LayerNorm, GELU, SiLU, sigmoid, ReLU, embedding, bias_add, elementwise_add",
    "SGD and Adam optimizers with GPU-side parameter update kernels",
    "cross_entropy_loss and mse_loss with forward + backward",
    "End-to-end demo: train a 2-layer MLP to convergence (XOR or MNIST subset)",
    "Numerical gradient check passes for all backward ops (finite differences vs autograd)",
]

