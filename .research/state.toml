[[epics]]
id = "gpu-iterator"
title = "GPU Iterator — par_iter() compiles to warp-parallel GPU kernels"
tier = 2
status = "active"
priority = "high"
depends_on = "structured-concurrency"
# North Star: Iterator chains are Rust's native way to express data-parallel compute.
#   par_iter() makes "compute walks all-warp cooperative" invisible — just iterators.
#   No GPU concepts leak: no kernel launch, no thread config, no cooperative() call.
# Litmus Test: data.par_iter().map(|x| x * 2.0 + 1.0).collect() produces
#   correct results on GPU, user doesn't know it's GPU code.
success_criteria = [
    "gpu::par_iter() maps Rust iterator chains to GPU warp-parallel execution",
    "MIR pass transforms iterator chain bodies into warp-parallel kernel code",
    "At least map, filter, fold, collect operations supported",
    "Demo: iterator chain that outperforms CPU Rayon on large data (>1M elements)",
]

[[epics]]
id = "auto-fusion"
title = "Auto Kernel Fusion — compile-time elementwise operation fusion"
tier = 2
status = "active"
priority = "medium"
# North Star: Users write idiomatic decomposed Rust and the compiler fuses the ops.
#   No "fused kernel" concept leaks — performance optimization is the compiler's job.
#   Plain Rust code gets plain Rust performance, automatically.
# Litmus Test: gelu(x * scale + bias) compiles to one GPU kernel launch,
#   not three. User never writes a fused kernel.
success_criteria = [
    "MIR pass identifies chains of elementwise operations across function boundaries",
    "Fused kernel generated at compile time (not runtime JIT)",
    "At least multiply + add + activation (GELU/ReLU) chains fused automatically",
    "Measurable speedup: fused chain >= 2x faster than sequential kernel launches",
]

