[[epics]]
id = "ownership-memory"
title = "Ownership = Memory Hierarchy — Rust lifetimes map to GPU memory tiers"
tier = 3
status = "pending"
priority = "low"
depends_on = "structured-concurrency"
# North Star: Shared vs global memory is a GPU concept that still leaks today.
#   Rust's ownership system absorbs it: lifetimes determine memory tier automatically.
#   No GPU concepts leak — not even memory hierarchy. It's just Rust lifetimes.
# Litmus Test: Misusing shared memory across blocks is a compile error, not a runtime bug.
success_criteria = [
    "Lifetime-parameterized memory types: &'block T → shared memory, &'grid T → global memory",
    "Borrow checker prevents cross-scope memory access at compile time",
    "Register promotion for move semantics in inner loops",
    "At least one real kernel where the type system catches a memory hierarchy bug",
]

