success_criteria = [
    "Generic kernel functions compile to PTX via monomorphization",
    "Trait bounds work in GPU code (T: Add + Copy, etc.)",
    "User-defined traits implementable for GPU types",
    "Demo: generic parallel_reduce<T: Reducible> working for f32, i32, custom types",
]

