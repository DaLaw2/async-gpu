# --- T0: Foundation (do first, everything depends on this) ---

[[epics]]
id = "gpu-test"
title = "GPU Test Framework — #[gpu_test] and cargo test on GPU"
tier = 0
status = "completed"
priority = "high"
# North Star: Testing GPU code is as natural as testing CPU code.
#   #[gpu_test] runs on GPU warps, assert! works across lanes, cargo test just works.
#   No GPU concepts leak into the test workflow.
# Litmus Test: A developer writes #[gpu_test] fn test_sum() { assert_eq!(gpu_sum(), 42); }
#   and cargo test runs it on GPU automatically.
success_criteria = [
    "#[gpu_test] attribute compiles test function to GPU kernel + host runner",
    "GPU-native assert! with warp/thread ID in failure messages",
    "cargo test integration — GPU tests discovered and run alongside CPU tests",
    "At least 10 existing GPU features covered by #[gpu_test] tests",
]

# --- T1: Core capability expansion ---

[[epics]]
id = "gpu-type-safety"
title = "Type-Level Safety — compile-time race-freedom for GPU code"
tier = 1
status = "completed"
priority = "high"
# North Star: The Rust compiler proves your GPU code has no data races — at compile time.
#   DisjointSlice<T> + ThreadIndex pattern (inspired by cuda-oxide), adapted to async-gpu.
#   GPU safety is a Rust type system feature, not a runtime check.
# Litmus Test: Writing overlapping writes to a shared buffer is a compile error.
success_criteria = [
    "DisjointSlice<T> type proves exclusive access per thread at compile time",
    "ThreadIndex<'kernel> is !Send + !Sync + !Copy, scoped to kernel lifetime",
    "3-tier safety model: safe (proven no races) / scoped unsafe / raw intrinsics",
    "Existing BlockScope/GridScope enhanced with type-level safety guarantees",
]

[[epics]]
id = "gpu-iterator"
title = "GPU Iterator — par_iter() compiles to warp-parallel GPU kernels"
tier = 1
status = "completed"
priority = "highest"
depends_on = "structured-concurrency"
# North Star: Iterator chains are Rust's native way to express data-parallel compute.
#   par_iter() makes "compute walks all-warp cooperative" invisible — just iterators.
#   No GPU concepts leak: no kernel launch, no thread config, no cooperative() call.
# Litmus Test: data.par_iter().map(|x| x * 2.0 + 1.0).collect() produces
#   correct results on GPU, user doesn't know it's GPU code.
success_criteria = [
    "gpu::par_iter() maps Rust iterator chains to GPU warp-parallel execution",
    "Compile-time fusion of iterator chain bodies into warp-parallel kernel code (via Rust monomorphization + LLVM optimization)",
    "At least map, filter, fold, collect operations supported",
    "Demo: iterator chain that outperforms CPU Rayon on large data (>1M elements)",
]

[[epics]]
id = "gpu-generics"
title = "GPU Generics — full Rust trait system + generics on GPU kernels"
tier = 1
status = "completed"
priority = "medium"
# North Star: GPU code is composable Rust code. Generic functions, trait bounds,
#   and impl blocks work on GPU just like on CPU. No concrete-type-only limitation.
