[[epics]]
id = "native-rust-dx"
title = "Native Rust DX — GPU code looks like normal Rust"
tier = 0
status = "completed"
priority = "highest"
# North Star: GPU code syntax is indistinguishable from normal Rust.
#   This is the SYNTAX FOUNDATION for unified I/O + Compute — both must look native.
# Litmus Test: Show a kernel with File::read + matmul + File::write to a Rust dev —
#   they can read it without knowing it's GPU code.
success_criteria = [
    "Kernel entry uses extern \"gpu-kernel\" fn main(), no custom attribute macros needed",
    "async fn works without #[warp_cooperative] or #[warp_async] — MIR pass handles it transparently",
    "Host-side launch is one line: gpu::run(kernel_main) — no GpuRuntime/HostcallSession/KernelRegistry exposed",
    "All examples/ rewritten in native Rust style — a Rust dev can read them without GPU knowledge",
]

[[epics]]
id = "std-thread-gpu"
title = "std::thread on GPU — thread::spawn() maps to warp"
tier = 0
status = "completed"
priority = "highest"
# North Star: thread::spawn() on GPU just works — this is the I/O PILLAR of the unified kernel.
#   Sequential I/O (file read/write, println!) happens in warp-as-thread mode.
# Litmus Test: VectorWare "threads on GPU" blog example compiles and runs on async-gpu.
success_criteria = [
    "Warp 0 runs main(), other warps sleep until thread::spawn() wakes them",
    "thread::spawn() returns JoinHandle, join() blocks parent warp until child completes",
    "thread::current(), thread::sleep(), thread::yield_now() all work",
    "thread::available_parallelism() returns number of available warps",
    "Example: spawn 2+ threads doing independent work, join results, println! — identical to CPU Rust",
]

# --- T1: Core pillars ---

[[epics]]
id = "cooperative-compute"
title = "Cooperative Compute — GPU-internal all-warp parallel computation"
tier = 1
status = "completed"
priority = "high"
# North Star: This is the COMPUTE PILLAR of the unified kernel. From sequential I/O context,
#   switch to all-warp data-parallel compute, then back. I/O + Compute in one fn main().
# Litmus Test: File::read → matmul → File::write in a single kernel, no mode-switch boilerplate.
success_criteria = [
    "gpu::cooperative(closure) wakes all warps, executes closure in data-parallel mode, returns result",
    "Seamless transition: sequential code (1 warp) → cooperative (all warps) → sequential — no manual sync",
    "Existing nn ops (matmul, attention, conv2d) callable from within a kernel via cooperative",
    "Demo: read file → matmul → write result, all in one extern \"gpu-kernel\" fn main()",
]

[[epics]]
id = "structured-concurrency"
title = "Structured Concurrency — scope-based parallelism mapped to GPU hardware"
tier = 1
status = "completed"
priority = "highest"
# North Star: Task scope = hardware scope. BlockScope uses shared memory, GridScope uses global.
#   Resources auto-reclaim when scope ends. Channels pick the fastest path automatically.
# Litmus Test: Users never manually choose shared vs global memory — the scope decides.
success_criteria = [
    "BlockScope and GridScope types enforce lifetime-bounded task scopes via Rust lifetimes",
    "Resources allocated within a scope auto-reclaim when scope ends (shared memory for block, global for grid)",
    "GpuChannel<T> auto-selects transport: shfl.sync (same warp), shared memory (same block), global (cross-block)",
    "Cancellation propagates down scope hierarchy — parent cancel kills all children",
    "Demo: producer-consumer pipeline using BlockScope with automatic shared memory channels",
]

