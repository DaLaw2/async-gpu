# Autonomous Research Loop State File
# Three-level hierarchy: Epic → Theme → Task
# Epics are user-defined high-level goals; Themes are research directions; Tasks are actionable items within a theme.

[meta]
created = "2026-03-11"
total_cycles = 117     # Monotonic counter, incremented after each completed phase
completed_tasks = 116
status = "running"     # ready | running | blocked | completed

# Current cycle position within Think/Do/Check/Adapt
current_mode = "do"
current_step = "do.execute"
current_task_id = "warp-cfg.4"
last_summary = "warp-cfg.3 done: loop/break in #[warp_async] works on GPU. CfgNode::Loop back-edge + BreakIf DECISION state verified with counter=0. Next: warp-cfg.4 (match support)."

# Sequence counters for unique file naming across iterations
brainstorm_seq = 29
review_seq = 5

# Brainstorm trigger control
last_brainstorm_at_completed = 107
brainstorm_interval = 3

# ============================================================
# File Naming Convention
# ============================================================
# Brainstorm:  brainstorm/bs{seq}-{role}.md, bs{seq}-synthesis.md
# Task:        tasks/{task_id}-c{cycle}.md     (e.g., tasks/toolchain.1-c3.md)
# Review:      reviews/rv{seq}-{task_id}-{role}.md, rv{seq}-{task_id}-synthesis.md
# Rework:      new task ID with .{n} suffix    (e.g., toolchain.4.1)

# ============================================================
# Epics (user-defined, only user can create/close)
# ============================================================

[[epics]]
id = "product-ready"
title = "Product Ready"
status = "active"
priority = "highest"   # Always highest, but does not block other epics
success_criteria = [
    "Anyone can clone from README and run hello-gpu with a single command",
    "New features cannot silently break existing functionality (CI protection)",
    "Public API is documented — no need to read internals to use it",
    "Performance data in README is accurate and reproducible",
]

[[epics]]
id = "warp-cooperative-async"
title = "Warp-Cooperative Async with Full Control Flow"
status = "active"
priority = "medium"    # Foundation for gpu-autonomous
success_criteria = [
    "#[warp_async] supports if/else with warp_*!() in arms — compiles and runs on GPU",
    "#[warp_async] supports loop with warp_*!() and break — compiles and runs on GPU",
    "#[warp_async] supports match with warp_*!() in arms — compiles and runs on GPU",
    "Nested control flow (if inside loop) works correctly",
    "All generated code maintains warp convergence (32 lanes agree on state)",
]

[[epics]]
id = "gpu-autonomous"
title = "GPU as Autonomous Compute Environment"
status = "active"
priority = "long-term" # Depends on warp-cooperative-async results
