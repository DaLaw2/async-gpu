[package]
name = "gpu-host"
version = "0.1.0"
edition = "2021"
description = "Host-side GPU runtime: kernel management, hostcall communication, pinned memory"

[features]
default = []
demo = []
gpt2 = ["dep:safetensors", "dep:tiktoken-rs"]
nn = ["dep:smallvec"]
cublas = ["cudarc/cublas"]
onnx = ["dep:prost"]
async = ["dep:tokio"]

[dependencies]
cudarc = { version = "0.12", features = ["cuda-12060"] }
gpu-protocol = { path = "../gpu-protocol" }
safetensors = { version = "0.7", optional = true }
smallvec = { version = "1", optional = true }
tiktoken-rs = { version = "0.6", optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time"], optional = true }
prost = { version = "0.13", optional = true }
