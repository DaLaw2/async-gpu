[workspace]

[package]
name = "gpu-kernel"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
gpu-atomics = { path = "../gpu-atomics" }
gpu-protocol = { path = "../gpu-protocol" }
gpu-runtime = { path = "../gpu-runtime" }
warp-macro = { path = "../warp-macro" }

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
