[workspace]

[package]
name = "gpu-libc"
version = "0.1.0"
edition = "2021"
description = "Minimal libc shim layer for GPU: stubs + device-side implementations"

[lib]
crate-type = ["rlib"]

[dependencies]
gpu-runtime = { path = "../gpu-runtime" }
gpu-protocol = { path = "../gpu-protocol" }

[profile.release]
panic = "abort"
opt-level = 3
lto = false
