[workspace]

[package]
name = "gpu-kernel-compute"
version = "0.1.0"
edition = "2021"
description = "GPU ML/HPC compute kernels — GEMM, transformer, CNN, search"

[features]
default = []
sm_80 = []

[lib]
crate-type = ["cdylib"]

[dependencies]
gpu-atomics = { path = "../../core/gpu-atomics" }
gpu-protocol = { path = "../../core/gpu-protocol" }
gpu-runtime = { path = "../../core/gpu-runtime" }
gpu-kernel-core = { path = "../gpu-kernel-core" }

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
