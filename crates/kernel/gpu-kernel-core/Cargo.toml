[workspace]

[package]
name = "gpu-kernel-core"
version = "0.1.0"
edition = "2021"
description = "Shared GPU kernel helpers and basic kernels"

[features]
default = []

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
gpu-atomics = { path = "../../core/gpu-atomics" }
gpu-libc = { path = "../../core/gpu-libc" }
gpu-protocol = { path = "../../core/gpu-protocol" }
gpu-runtime = { path = "../../core/gpu-runtime" }

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
