[workspace]

[package]
name = "gpu-kernel-io"
version = "0.1.0"
edition = "2021"
description = "GPU hostcall, I/O, and pipeline kernels"

[lib]
crate-type = ["cdylib"]

[dependencies]
gpu-atomics = { path = "../../core/gpu-atomics" }
gpu-libc = { path = "../../core/gpu-libc" }
gpu-protocol = { path = "../../core/gpu-protocol" }
gpu-runtime = { path = "../../core/gpu-runtime" }
gpu-kernel-core = { path = "../gpu-kernel-core" }

# Dev-mode release: fast PTX builds (opt-level 1, no LTO)
[profile.release]
panic = "abort"
opt-level = 1
lto = false

# Production release: maximum optimization for benchmarks/shipping
[profile.release-prod]
inherits = "release"
panic = "abort"
opt-level = 3
lto = "fat"
