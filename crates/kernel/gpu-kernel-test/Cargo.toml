[workspace]

[package]
name = "gpu-kernel-test"
version = "0.1.0"
edition = "2021"
description = "GPU test and demo kernels — std-based entry points for testing (println!, Vec, File, thread, etc.)"

[features]
default = []
sm_80 = []  # Enable sm_80+ features (MMA tensor cores, bf16, tf32)

[lib]
crate-type = ["cdylib"]

[dependencies]
gpu-atomics = { path = "../../core/gpu-atomics" }
gpu-kernel-core = { path = "../gpu-kernel-core" }
gpu-libc = { path = "../../core/gpu-libc" }
gpu-protocol = { path = "../../core/gpu-protocol" }
gpu-runtime = { path = "../../core/gpu-runtime" }

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
