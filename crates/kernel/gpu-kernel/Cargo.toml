[workspace]

[package]
name = "gpu-kernel"
version = "0.1.0"
edition = "2021"

[features]
default = []
sm_80 = []  # Enable sm_80+ features (MMA tensor cores, bf16, tf32)
gpu_kernel_abi = []  # Enable extern "gpu-kernel" ABI (requires patched rustc)

[lib]
crate-type = ["cdylib"]

[dependencies]
gpu-atomics = { path = "../../core/gpu-atomics" }
gpu-libc = { path = "../../core/gpu-libc" }
gpu-protocol = { path = "../../core/gpu-protocol" }
gpu-runtime = { path = "../../core/gpu-runtime" }
warp-macro = { path = "../../macro/warp-macro" }

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
