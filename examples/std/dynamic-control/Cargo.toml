[workspace]

[package]
name = "dynamic-control"
version = "0.1.0"
edition = "2021"
description = "Dynamic control flow on GPU — variable-length generation, data-dependent branching"

[dependencies]
cudarc = { version = "0.12", features = ["cuda-12060"] }
gpu-host = { path = "../../../crates/core/gpu-host", features = ["nn", "gpt2"], default-features = false }
