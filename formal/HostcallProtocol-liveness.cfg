\* HostcallProtocol — Liveness Configuration
\*
\* Uses ACTION_CONSTRAINT instead of CONSTRAINT to avoid
\* false liveness counterexamples from truncated behaviors.
\* Smaller model (2 GPU + 2 packets) for tractable liveness checking.

CONSTANT
    GPU_THREADS = {"g1", "g2"}
    PACKETS     = {"p1", "p2"}
    NULL        = "null"

SPECIFICATION Spec

\* ACTION_CONSTRAINT allows states at the boundary but prevents
\* FURTHER transitions that would exceed the constraint. This
\* avoids truncating behaviors needed for liveness checking.
ACTION_CONSTRAINT StateConstraint

\* Safety invariants (still checked)
INVARIANT TypeOK
INVARIANT NoDoubleOwnership
INVARIANT PacketConservation

\* Liveness properties
PROPERTY ResponseDelivery
PROPERTY PacketRecycling
PROPERTY FullLifecycle
