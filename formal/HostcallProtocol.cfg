\* HostcallProtocol — TLC Model Configuration
\*
\* Model parameters: 3 GPU threads, 1 host thread, 3 packets.
\* This is the recommended minimum for meaningful ABA verification.

\* ================================================================
\*  CONSTANTS
\* ================================================================

CONSTANT
    GPU_THREADS = {"g1", "g2", "g3"}
    PACKETS     = {"p1", "p2", "p3"}
    NULL        = "null"
    INIT_FREE_SEQ = <<"p1", "p2", "p3">>

\* ================================================================
\*  SPECIFICATION (includes fairness via WF)
\* ================================================================

SPECIFICATION Spec

\* ================================================================
\*  STATE CONSTRAINT
\*
\*  Bounds monotonically increasing counters (tags, doorbell) to
\*  keep the state space finite. Without this, TLC would never
\*  terminate because tags increment on every push.
\* ================================================================

CONSTRAINT StateConstraint

\* ================================================================
\*  SAFETY INVARIANTS
\*
\*  These are checked at every reachable state.
\* ================================================================

INVARIANT TypeOK
INVARIANT NoDoubleOwnership
INVARIANT PacketConservation
INVARIANT StateConsistency
INVARIANT StacksDisjoint

\* ================================================================
\*  LIVENESS (TEMPORAL) PROPERTIES
\*
\*  These require the fairness conditions in Spec (WF_vars).
\*  TLC checks these using the liveness checking algorithm.
\*
\*  IMPORTANT: Liveness checking with state constraints can produce
\*  false counterexamples because the constraint truncates behaviors.
\*  Run safety invariants first. For liveness, either:
\*    (a) increase MAX_TAG to ensure enough room for full lifecycles, or
\*    (b) comment out CONSTRAINT and use ACTION_CONSTRAINT instead.
\*
\*  Recommended: run safety-only first (comment out PROPERTY lines),
\*  then enable liveness properties for a separate run.
\* ================================================================

\* PROPERTY ResponseDelivery
\* PROPERTY PacketRecycling
\* PROPERTY FullLifecycle
